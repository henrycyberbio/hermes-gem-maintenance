[project]
name = "hermes-gem-maintenance"
version = "0.1.0"
description = "Agent-driven maintenance of genome-scale metabolic models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cobra>=0.32,<0.33",
    "fire>=0.7,<0.8",
]

[project.scripts]
hermes-gem-maintenance = "hermes_gem_maintenance.cli:main"

[project.optional-dependencies]
# MEMOTE is not used by this package. It is the standard test suite for whole-model
# quality and belongs in a review workflow, not in the install of a tool that adds
# one reaction -- as a runtime dependency it pulled pytest, PyGithub, SQLAlchemy and
# cookiecutter into every install for no functionality.
memote = ["memote==0.17.0"]

[dependency-groups]
dev = [
    "citeproc-py>=0.11.1",
    "pytest>=8.0",
]


[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Import scripts/ as a package root so tests can exercise the walkthrough directly.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "I", "E", "W", "N", "UP", "ANN", "ASYNC", "FBT", "B", "C4", "DTZ", "FA", "LOG",
    "T20", "PT", "RET", "SIM", "TID", "TC", "PTH", "ERA", "TRY", "FAST", "PERF", "FURB",
]
