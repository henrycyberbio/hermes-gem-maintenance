[project]
name = "hermes-gem-maintenance"
version = "0.1.0"
description = "Agent-driven maintenance of genome-scale metabolic models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cobra>=0.32,<0.33",
    "fire>=0.7,<0.8",
]

[project.scripts]
hermes-gem-maintenance = "hermes_gem_maintenance.cli:main"

[project.optional-dependencies]
# MEMOTE is not imported by any module at load time -- consistency_review.py imports
# it lazily inside consistency_snapshot(), so `inspect`, `resolve`, `add_reaction` and
# `check` never pull in pytest, PyGithub, SQLAlchemy or cookiecutter. `export` does
# require it: publish_deliverable() calls consistency_snapshot() as part of the
# delivery gate (local/Hermes-GEM_Plan_v0.1.md S10), and raises DependencyMissingError
# if the group below is not installed. Treat this extra as required before running
# `export` against a real delivery, not as something a caller may skip.
memote = ["memote==0.17.0"]

[dependency-groups]
dev = [
    "citeproc-py>=0.11.1",
    "pytest>=8.0",
    "memote==0.17.0",
]


[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# Import scripts/ as a package root so tests can exercise the walkthrough directly.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "I", "E", "W", "N", "UP", "ANN", "ASYNC", "FBT", "B", "C4", "DTZ", "FA", "LOG",
    "T20", "PT", "RET", "SIM", "TID", "TC", "PTH", "ERA", "TRY", "FAST", "PERF", "FURB",
]
